<svg width="828" height="1792" viewBox="0 0 828 1792" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iPhone 11 Pro Max / 12 Pro Max / 13 Pro Max / 14 Plus Splash Screen -->
  <rect width="828" height="1792" fill="#0D0E12"/>
  
  
  <!-- Centered App Icon -->
  <g transform="translate(314, 796)">
    <!-- Main Icon (200x200) -->
    <circle cx="100" cy="100" r="100" fill="#0D0E12"/>
    <circle cx="100" cy="100" r="85" fill="#0D0E12"/>
    
    <!-- Streaming Symbol -->
    <g transform="translate(25, 25)" stroke="#6366F1" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M75 37.5 C105 37.5, 112.5 53.75, 112.5 75 C112.5 96.25, 105 112.5, 75 112.5"/>
      <path d="M75 18.75 C123.75 18.75, 131.25 44.375, 131.25 75 C131.25 105.625, 123.75 131.25, 75 131.25"/>
      <path d="M75 0 C142.5 0, 150 35, 150 75 C150 115, 142.5 150, 75 150"/>
    </g>
    
    <!-- Central Point -->
    <circle cx="100" cy="100" r="8" fill="#6366F1"/>
    <circle cx="100" cy="100" r="4" fill="#0D0E12"/>
    
    <!-- Profile Card -->
    <rect x="40" y="82" width="42" height="18" rx="4" fill="#6366F1"/>
    <rect x="44" y="86" width="9" height="9" rx="2" fill="#0D0E12"/>
    <rect x="56" y="87.5" width="18" height="2" rx="1" fill="#0D0E12"/>
    <rect x="56" y="91.5" width="14" height="2" rx="1" fill="#0D0E12"/>
  </g>
  
  <!-- App Name -->
  <text x="414" y="1050" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="500">
    Stream Chameleon
  </text>
  
  <!-- Subtitle -->
  <text x="414" y="1090" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
    Stream Profile Manager
  </text>
  
  <!-- Loading indicator -->
  <g transform="translate(394, 1150)">
    <circle cx="20" cy="20" r="20" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="20" cy="20" r="20" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" 
            stroke-dasharray="31.416" stroke-dashoffset="31.416">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" 
                        from="0 20 20" to="360 20 20" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>