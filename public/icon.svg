<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="#0D0E12"/>
  <circle cx="256" cy="256" r="240" fill="#0D0E12"/>
  
  <!-- Main Icon Container -->
  <g transform="translate(128, 128)">
    <!-- Streaming Symbol - Abstract broadcast waves -->
    <g stroke="#6366F1" stroke-width="12" fill="none" stroke-linecap="round">
      <!-- Inner wave -->
      <path d="M128 64 C180 64, 192 92, 192 128 C192 164, 180 192, 128 192"/>
      <!-- Middle wave -->
      <path d="M128 32 C212 32, 224 76, 224 128 C224 180, 212 224, 128 224"/>
      <!-- Outer wave -->
      <path d="M128 0 C244 0, 256 60, 256 128 C256 196, 244 256, 128 256"/>
    </g>
    
    <!-- Central Broadcast Point -->
    <circle cx="128" cy="128" r="16" fill="#6366F1"/>
    <circle cx="128" cy="128" r="8" fill="#0D0E12"/>
    
    <!-- Profile/Stream Indicator -->
    <rect x="40" y="112" width="72" height="32" rx="8" fill="#6366F1"/>
    <rect x="48" y="120" width="16" height="16" rx="4" fill="#0D0E12"/>
    <rect x="72" y="122" width="32" height="4" rx="2" fill="#0D0E12"/>
    <rect x="72" y="130" width="24" height="4" rx="2" fill="#0D0E12"/>
  </g>
</svg>